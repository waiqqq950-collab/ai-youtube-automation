name: AI Tools Daily - Create Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          ffmpeg -version | head -n 1
          python3 -c "from PIL import Image; print('Pillow OK')"

      - name: Get AI content
        shell: bash
        run: |
          set -e
          URL="https://ai-youtube-automation.waiqqq950.workers.dev/daily-content"

          curl --fail-with-body --silent --show-error --location "$URL" -o content.json

          echo "===== CONTENT ====="
          cat content.json
          echo
          echo "===== END CONTENT ====="

          python3 - <<'PY'
          import json
          with open("content.json", encoding="utf-8") as f:
              d = json.load(f)

          for key in ["title","script","description","tags","visual_prompts"]:
              if key not in d:
                  raise SystemExit("Missing field: " + key)

          if not d["script"].strip():
              raise SystemExit("Script is empty")

          if not isinstance(d["visual_prompts"], list) or len(d["visual_prompts"]) < 3:
              raise SystemExit("Need at least 3 visual prompts")

          print("Content OK")

      - name: Generate AI presenter
        shell: bash
        run: |
          set -e

          curl --fail-with-body --silent --show-error --location --request POST \
            --data-urlencode "prompt=Realistic friendly professional AI presenter speaking directly to camera in a modern technology studio, waist-up, natural confident expression, premium cinematic lighting, dark modern background, vertical 9:16, no readable text, no logos" \
            --data-urlencode "seed=424242" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-image" \
            -o presenter.jpg

          test -s presenter.jpg
          file presenter.jpg

      - name: Generate topic visual 1
        shell: bash
        run: |
          set -e
          P=$(python3 -c 'import json; print(json.load(open("content.json"))["visual_prompts"][0])')

          curl --fail-with-body --silent --show-error --location --request POST \
            --data-urlencode "prompt=$P" \
            --data-urlencode "seed=1001" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-image" \
            -o visual1.jpg

          test -s visual1.jpg
          file visual1.jpg

      - name: Generate topic visual 2
        shell: bash
        run: |
          set -e
          P=$(python3 -c 'import json; print(json.load(open("content.json"))["visual_prompts"][1])')

          curl --fail-with-body --silent --show-error --location --request POST \
            --data-urlencode "prompt=$P" \
            --data-urlencode "seed=1002" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-image" \
            -o visual2.jpg

          test -s visual2.jpg
          file visual2.jpg

      - name: Generate topic visual 3
        shell: bash
        run: |
          set -e
          P=$(python3 -c 'import json; print(json.load(open("content.json"))["visual_prompts"][2])')

          curl --fail-with-body --silent --show-error --location --request POST \
            --data-urlencode "prompt=$P" \
            --data-urlencode "seed=1003" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-image" \
            -o visual3.jpg

          test -s visual3.jpg
          file visual3.jpg

      - name: Create AI voice
        shell: bash
        run: |
          set -e
          SCRIPT=$(python3 -c 'import json; print(json.load(open("content.json"))["script"])')

          curl --fail-with-body --silent --show-error --location --get \
            --data-urlencode "script=$SCRIPT" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-audio" \
            -o voice.mp3

          test -s voice.mp3
          file voice.mp3

          ffprobe -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            voice.mp3

      - name: Create captions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re
          import subprocess

          with open("content.json", encoding="utf-8") as f:
              d = json.load(f)

          words = re.findall(r"\S+", d["script"])
          chunks = [" ".join(words[i:i+5]) for i in range(0, len(words), 5)]

          duration = float(subprocess.check_output([
              "ffprobe","-v","error",
              "-show_entries","format=duration",
              "-of","default=nw=1:nk=1","voice.mp3"
          ], text=True).strip())

          per = duration / max(1, len(chunks))

          def t(x):
              h=int(x//3600)
              m=int((x%3600)//60)
              s=x%60
              return f"{h}:{m:02d}:{s:05.2f}".replace(".",",")

          with open("captions.ass","w",encoding="utf-8") as f:
              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,58,&H00FFFFFF,&H00FFFFFF,&H00111111,&H80111111,-1,0,0,0,100,100,0,0,1,4,2,2,60,60,240,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """)
              for i,c in enumerate(chunks):
                  f.write(f"Dialogue: 0,{t(i*per)},{t(min(duration,(i+1)*per))},Default,,0,0,0,,{c}\n")
          print("Captions OK")
          PY

      - name: Render six scenes
        shell: bash
        run: |
          set -e

          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice.mp3)
          EACH=$(python3 -c "print(max(3.5, float('$D') / 6.0))")

          for N in 1 2 3 4 5 6; do
            case "$N" in
              1) IMG="presenter.jpg" ;;
              2) IMG="visual1.jpg" ;;
              3) IMG="visual2.jpg" ;;
              4) IMG="visual3.jpg" ;;
              5) IMG="presenter.jpg" ;;
              6) IMG="visual1.jpg" ;;
            esac

            ffmpeg -y -loop 1 -i "$IMG" -t "$EACH" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0015,1.12)':d=1:s=1080x1920:fps=30,eq=contrast=1.05:saturation=1.08,format=yuv420p" \
              -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
              "scene${N}.mp4"
          done

      - name: Render final video
        shell: bash
        run: |
          set -e

          printf "file '%s'\n" scene1.mp4 scene2.mp4 scene3.mp4 scene4.mp4 scene5.mp4 scene6.mp4 > scenes.txt

          ffmpeg -y -f concat -safe 0 -i scenes.txt -c copy base.mp4

          ffmpeg -y -i base.mp4 -i voice.mp3 \
            -vf "subtitles=captions.ass,drawbox=x=0:y=0:w=iw:h=170:color=black@0.45:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='AI TOOLS DAILY':fontcolor=white:fontsize=46:x=(w-text_w)/2:y=55" \
            -c:v libx264 -preset veryfast -crf 22 \
            -c:a aac -b:a 128k -shortest -movflags +faststart video.mp4

          test -s video.mp4

      - name: Upload to YouTube
        shell: bash
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          set -e

          TITLE=$(python3 -c 'import json; print(json.load(open("content.json"))["title"])')
          DESCRIPTION=$(python3 -c 'import json; print(json.load(open("content.json"))["description"])')
          TAGS=$(python3 -c 'import json; print(",".join(json.load(open("content.json"))["tags"]))')

          curl --fail-with-body --silent --show-error --location \
            -X POST \
            "https://ai-youtube-automation.waiqqq950.workers.dev/youtube/upload" \
            -H "X-Upload-Secret: $UPLOAD_SECRET" \
            -F "video=@video.mp4;type=video/mp4" \
            -F "title=$TITLE" \
            -F "description=$DESCRIPTION" \
            -F "tags=$TAGS"

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tools-daily-video
          path: |
            video.mp4
            content.json
            voice.mp3
          retention-days: 7
