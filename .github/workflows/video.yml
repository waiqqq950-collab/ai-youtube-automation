name: AI Tools Daily - HeyGen Presenter V4

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ai-tools-daily-video
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get AI content package
        run: |
          set -e
          curl -fsSL \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-content" \
            -o content.json

          python3 - <<'PY'
          import json, sys

          with open("content.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if "error" in data:
              print("WORKER ERROR:")
              print(data["error"])
              sys.exit(1)

          required = ["title", "script", "description", "tags"]
          missing = [x for x in required if not data.get(x)]
          if missing:
              print("Missing fields:", missing)
              sys.exit(1)

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(str(data["script"]).strip())

          with open("title.txt", "w", encoding="utf-8") as f:
              f.write(str(data["title"]).strip())

          with open("description.txt", "w", encoding="utf-8") as f:
              f.write(str(data["description"]).strip())

          with open("tags.txt", "w", encoding="utf-8") as f:
              f.write(",".join(str(x).strip() for x in data["tags"] if str(x).strip()))

          print("===== TITLE =====")
          print(data["title"])
          print("===== SCRIPT =====")
          print(data["script"])
          PY

      - name: Generate HeyGen presenter video
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path("script.txt").read_text(encoding="utf-8").strip()
          title = Path("title.txt").read_text(encoding="utf-8").strip()

          prompt = f"""
          Create a polished 35 to 50 second YouTube Short in PORTRAIT 9:16 for the channel "AI Tools Daily".

          Topic/title:
          {title}

          Use this EXACT narration/script. Do not rewrite it, shorten it, or add facts:
          {script}

          VISUAL STYLE:
          - Use a realistic professional male AI presenter as the main on-camera host.
          - The presenter should look directly at the viewer and naturally speak the narration.
          - Use natural facial expressions, eye movement, head movement and hand gestures.
          - Keep the presenter visually engaging; do not use a frozen still image.
          - Change the visual composition frequently to maintain attention.
          - Add topic-relevant B-roll, UI-style graphics, animated callouts, icons, charts or simple motion graphics when they help explain the topic.
          - Use clean modern AI/technology aesthetics, premium lighting and strong visual hierarchy.
          - Use smooth but noticeable scene transitions and motion.
          - Avoid generic stock-footage feeling.
          - Do NOT make the video a slideshow of static cards.
          - Do NOT put large paragraphs on screen.
          - Keep on-screen text short, readable and synchronized with the narration.
          - Burn in concise captions/subtitles.
          - Use a strong visual hook in the first 1-2 seconds.
          - End with a clear visual CTA: "Subscribe for more AI tips."
          - No fake statistics, no unsupported claims, no watermarks, no logos other than the channel name if appropriate.
          - English language.
          - Designed specifically for YouTube Shorts retention.
          """

          Path("heygen_request.json").write_text(
              json.dumps({
                  "prompt": prompt,
                  "orientation": "portrait"
              }),
              encoding="utf-8"
          )
          PY

          echo "Starting HeyGen Video Agent..."

          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "X-Api-Key: $HEYGEN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @heygen_request.json \
            -o heygen-create.json \
            -w "%{http_code}" \
            "https://api.heygen.com/v3/video-agents")

          echo "HeyGen create HTTP code: $HTTP_CODE"
          cat heygen-create.json

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            exit 1
          fi

          SESSION_ID=$(python3 - <<'PY'
          import json
          d=json.load(open("heygen-create.json"))
          print(d["data"]["session_id"])
          PY
          )

          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
          echo "HeyGen session: $SESSION_ID"

      - name: Wait for HeyGen video
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          set -e

          VIDEO_ID=""

          for i in $(seq 1 60); do
            echo "HeyGen session check $i/60..."

            curl -fsSL \
              -H "X-Api-Key: $HEYGEN_API_KEY" \
              "https://api.heygen.com/v3/video-agents/$SESSION_ID" \
              -o heygen-session.json

            cat heygen-session.json

            STATUS=$(python3 - <<'PY'
            import json
            d=json.load(open("heygen-session.json"))
            print(d.get("data",{}).get("status","unknown"))
            PY
            )

            echo "Session status: $STATUS"

            VIDEO_ID=$(python3 - <<'PY'
            import json
            d=json.load(open("heygen-session.json"))
            print(d.get("data",{}).get("video_id") or "")
            PY
            )

            if [ -n "$VIDEO_ID" ]; then
              echo "VIDEO_ID=$VIDEO_ID" >> "$GITHUB_ENV"
              break
            fi

            if [ "$STATUS" = "failed" ]; then
              exit 1
            fi

            sleep 15
          done

          if [ -z "$VIDEO_ID" ]; then
            echo "HeyGen did not return a video_id within the waiting period."
            exit 1
          fi

          echo "HeyGen VIDEO_ID=$VIDEO_ID"

      - name: Download completed HeyGen video
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          set -e

          VIDEO_URL=""

          for i in $(seq 1 60); do
            echo "Render check $i/60..."

            curl -fsSL \
              -H "X-Api-Key: $HEYGEN_API_KEY" \
              "https://api.heygen.com/v3/videos/$VIDEO_ID" \
              -o heygen-video.json

            cat heygen-video.json

            STATUS=$(python3 - <<'PY'
            import json
            d=json.load(open("heygen-video.json"))
            print(d.get("data",{}).get("status","unknown"))
            PY
            )

            echo "Video status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              VIDEO_URL=$(python3 - <<'PY'
              import json
              d=json.load(open("heygen-video.json"))
              print(d.get("data",{}).get("video_url") or "")
              PY
              )
              break
            fi

            if [ "$STATUS" = "failed" ]; then
              python3 - <<'PY'
              import json
              d=json.load(open("heygen-video.json"))
              data=d.get("data",{})
              print("HeyGen failure:", data.get("failure_message"))
              print("Failure code:", data.get("failure_code"))
              PY
              exit 1
            fi

            sleep 15
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "HeyGen video did not complete within the waiting period."
            exit 1
          fi

          echo "Downloading final video..."
          curl -fL "$VIDEO_URL" -o video.mp4

          test -s video.mp4
          file video.mp4

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            video.mp4

      - name: Upload to YouTube
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          set -e

          TITLE=$(cat title.txt)
          DESCRIPTION=$(cat description.txt)
          TAGS=$(cat tags.txt)

          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "X-Upload-Secret: $UPLOAD_SECRET" \
            -H "X-Video-Title: $TITLE" \
            -H "X-Video-Description: $DESCRIPTION" \
            -H "X-Video-Tags: $TAGS" \
            -H "Content-Type: video/mp4" \
            --data-binary "@video.mp4" \
            -o upload-response.txt \
            -w "%{http_code}" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/youtube/upload")

          echo "YouTube upload HTTP code: $HTTP_CODE"
          cat upload-response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: ai-tools-daily-heygen-v4
          path: |
            video.mp4
            script.txt
            content.json
            heygen-create.json
            heygen-session.json
            heygen-video.json
