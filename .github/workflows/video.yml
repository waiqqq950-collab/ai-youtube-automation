name: AI Tools Daily - One Time V5

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ai-tools-daily-v5
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install video tools
        shell: bash
        run: |
          set -e
          echo "Checking video tools..."

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y ffmpeg
          fi

          if ! python3 -c "from PIL import Image" >/dev/null 2>&1; then
            sudo apt-get install -y python3-pil
          fi

          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get install -y fonts-dejavu
          fi

          ffmpeg -version | head -n 1
          python3 --version
          python3 -c "from PIL import Image; print('Pillow OK')"

      - name: Get AI content package
        shell: bash
        run: |
          set -e

          WORKER_URL="https://ai-youtube-automation.waiqqq950.workers.dev"

          HTTP_CODE=$(curl -sS \
            -o content.json \
            -w "%{http_code}" \
            "$WORKER_URL/daily-content")

          echo "Content HTTP code: $HTTP_CODE"
          cat content.json
          echo

          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi

          python3 - <<'PY'
          import json, sys, re

          with open("content.json", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "title", "hook", "tool", "script",
              "benefit", "example", "tip", "cta",
              "visual_prompts", "description", "tags"
          ]

          missing = [x for x in required if not data.get(x)]
          if missing:
              raise SystemExit("Missing fields: " + ", ".join(missing))

          if not isinstance(data["visual_prompts"], list) or len(data["visual_prompts"]) < 3:
              raise SystemExit("Need at least 3 visual prompts")
          words = re.findall(r"\S+", data["script"])
          if len(words) > 120:
           raise SystemExit(f"Script too long: {len(words)} words")

          open("script.txt", "w", encoding="utf-8").write(data["script"].strip())
          open("title.txt", "w", encoding="utf-8").write(data["title"].strip())
          open("description.txt", "w", encoding="utf-8").write(data["description"].strip())
          open("tags.txt", "w", encoding="utf-8").write(",".join(data["tags"]))

          print("===== TITLE =====")
          print(data["title"])
          print("===== SCRIPT =====")
          print(data["script"])
          print("===== TOOL =====")
          print(data["tool"])
          print("===== HOOK =====")
          print(data["hook"])
          PY

      - name: Generate presenter and topic visuals
        shell: bash
        run: |
          set -e

          WORKER_URL="https://ai-youtube-automation.waiqqq950.workers.dev"

          python3 - <<'PY'
          import json, urllib.request, urllib.error

          BASE = "https://ai-youtube-automation.waiqqq950.workers.dev/daily-image"

          with open("content.json", encoding="utf-8") as f:
              data = json.load(f)

          def generate(filename, prompt):
              payload = json.dumps({
                  "prompt": prompt
              }).encode("utf-8")

              req = urllib.request.Request(
                  BASE,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      body = r.read()
                      if r.status != 200:
                          raise RuntimeError(f"HTTP {r.status}: {body[:500]!r}")
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {e.code}: {detail[:1000]}")

              open(filename, "wb").write(body)
              print(filename, len(body), "bytes")

          presenter_prompt = (
              "Realistic friendly professional AI presenter, adult man, "
              "waist-up, looking directly at camera, natural confident expression, "
              "one hand slightly raised as if explaining a useful tip, "
              "modern technology studio, premium cinematic lighting, "
              "clean dark background, vertical composition"
          )

          generate("presenter.jpg", presenter_prompt)

          prompts = data["visual_prompts"][:3]
          for i, prompt in enumerate(prompts, start=1):
              generate(f"visual{i}.jpg", prompt)

          PY

          file presenter.jpg visual1.jpg visual2.jpg visual3.jpg

      - name: Create AI voice
        shell: bash
        run: |
          set -e

          WORKER_URL="https://ai-youtube-automation.waiqqq950.workers.dev"
          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data-binary "@script.txt" \
            -o voice.mp3 \
            -w "%{http_code}" \
            "$WORKER_URL/daily-audio")

          echo "Audio HTTP code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "===== AUDIO ERROR ====="
            cat voice.mp3 || true
            exit 1
          fi

          test -s voice.mp3
          file voice.mp3

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            voice.mp3)

          echo "Voice duration: $DURATION seconds"

      - name: Build dynamic captions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json, re, subprocess, math

          data = json.load(open("content.json", encoding="utf-8"))
          script = data["script"].strip()
          words = re.findall(r"\S+", script)

          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=nw=1:nk=1",
              "voice.mp3"
          ], text=True).strip())

          # 3–5 words per caption, timed to narration.
          chunks = [" ".join(words[i:i+4]) for i in range(0, len(words), 4)]
          per = duration / max(1, len(chunks))

          def ass_time(x):
              h = int(x // 3600)
              m = int((x % 3600) // 60)
              s = x % 60
              return f"{h}:{m:02d}:{s:05.2f}".replace(".", ",")

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,64,&H00FFFFFF,&H00FFFFFF,&H00000000,&H99000000,-1,0,0,0,100,100,0,0,1,3,1,2,70,70,280,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          with open("captions.ass", "w", encoding="utf-8") as f:
              f.write(header)
              for i, chunk in enumerate(chunks):
                  start = i * per
                  end = min(duration, (i + 1) * per)
                  f.write(
                      f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Default,,0,0,0,,{chunk}\n"
                  )

          print("Caption chunks:", len(chunks))
          print("Voice duration:", duration)
          PY

      - name: Build fast paced scenes
        shell: bash
        run: |
          set -e

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            voice.mp3)

          # Five visual beats. The first and last use the presenter.
          EACH=$(python3 -c "d=float('$DURATION'); print(max(2.5, d/5.0))")
          echo "Each scene: $EACH"

          for i in 1 2 3 4 5; do
            case "$i" in
              1) IMG="presenter.jpg" ;;
              2) IMG="visual1.jpg" ;;
              3) IMG="visual2.jpg" ;;
              4) IMG="visual3.jpg" ;;
              5) IMG="presenter.jpg" ;;
            esac

            ffmpeg -y \
              -loop 1 \
              -i "$IMG" \
              -t "$EACH" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='if(lte(zoom,1.0),1.0,min(zoom+0.0028,1.14))':d=1:s=1080x1920:fps=30,eq=contrast=1.06:saturation=1.12,unsharp=5:5:0.5:5:5:0,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 22 \
              -pix_fmt yuv420p \
              "scene${i}.mp4"
          done

      - name: Render final Short
        shell: bash
        run: |
          set -e

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            voice.mp3)

          EACH=$(python3 -c "d=float('$DURATION'); print(max(2.5, d/5.0))")
          EACH_MINUS_035=$(python3 -c "e=float('$EACH'); print(max(0,e-0.35))")
          EACH2_MINUS_070=$(python3 -c "e=float('$EACH'); print(max(0,2*e-0.70))")
          EACH3_MINUS_105=$(python3 -c "e=float('$EACH'); print(max(0,3*e-1.05))")
          EACH4_MINUS_140=$(python3 -c "e=float('$EACH'); print(max(0,4*e-1.40))")

          HOOK=$(python3 -c 'import json; print(json.load(open("content.json"))["hook"].replace(":", "\\:").replace("\x27", "\x27\x27"))')
          TOOL=$(python3 -c 'import json; print(json.load(open("content.json"))["tool"].replace(":", "\\:").replace("\x27", "\x27\x27"))')
          BENEFIT=$(python3 -c 'import json; print(json.load(open("content.json"))["benefit"].replace(":", "\\:").replace("\x27", "\x27\x27"))')
          CTA=$(python3 -c 'import json; print(json.load(open("content.json"))["cta"].replace(":", "\\:").replace("\x27", "\x27\x27"))')

          echo "===== PASS 1: BUILD VIDEO SCENES ====="

          ffmpeg -y \
            -i scene1.mp4 \
            -i scene2.mp4 \
            -i scene3.mp4 \
            -i scene4.mp4 \
            -i scene5.mp4 \
            -filter_complex "
              [0:v]drawbox=x=55:y=120:w=970:h=250:color=black@0.48:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='${HOOK}':fontcolor=white:fontsize=68:line_spacing=8:x=(w-text_w)/2:y=180:enable='between(t,0,${EACH})'[v0];
              [1:v]drawbox=x=70:y=125:w=940:h=170:color=black@0.50:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='TRY: ${TOOL}':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=175[v1];
              [2:v]drawbox=x=60:y=135:w=960:h=220:color=black@0.48:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='BEFORE  →  AFTER':fontcolor=white:fontsize=62:x=(w-text_w)/2:y=205[v2];
              [3:v]drawbox=x=60:y=135:w=960:h=270:color=black@0.48:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='${BENEFIT}':fontcolor=white:fontsize=55:line_spacing=8:x=(w-text_w)/2:y=185[v3];
              [4:v]drawbox=x=80:y=145:w=920:h=190:color=black@0.50:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='${CTA}':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=205[v4];
              [v0][v1]xfade=transition=slideleft:duration=0.35:offset=${EACH_MINUS_035}[x1];
              [x1][v2]xfade=transition=slideright:duration=0.35:offset=${EACH2_MINUS_070}[x2];
              [x2][v3]xfade=transition=fade:duration=0.35:offset=${EACH3_MINUS_105}[x3];
              [x3][v4]xfade=transition=slideup:duration=0.35:offset=${EACH4_MINUS_140}[x4]
            " \
            -map "[x4]" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -level:v 4.2 \
            -pix_fmt yuv420p \
            -r 30 \
            -fps_mode cfr \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -bf 2 \
            -flags +cgop \
            -crf 21 \
            -movflags +faststart \
            -use_editlist 0 \
            silent.mp4

          echo "===== PASS 2: FINAL YOUTUBE FILE ====="

          ffmpeg -y \
            -i silent.mp4 \
            -i voice.mp3 \
            -vf "subtitles=captions.ass,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='AI TOOLS DAILY':fontcolor=white:fontsize=34:x=45:y=55:alpha=0.78" \
            -map 0:v:0 \
            -map 1:a:0 \
            -map_metadata -1 \
            -c:v libx264 \
            -preset veryfast \
            -profile:v high \
            -level:v 4.2 \
            -pix_fmt yuv420p \
            -r 30 \
            -fps_mode cfr \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -bf 2 \
            -flags +cgop \
            -crf 22 \
            -tag:v avc1 \
            -c:a aac \
            -profile:a aac_low \
            -ar 48000 \
            -ac 2 \
            -b:a 128k \
            -af "aresample=48000:async=1:first_pts=0" \
            -shortest \
            -avoid_negative_ts make_zero \
            -movflags +faststart \
            -use_editlist 0 \
            -video_track_timescale 90000 \
            video.mp4

          echo "===== FINAL VIDEO CHECK ====="

          ffprobe -v error \
            -show_entries format=duration,size,format_name,start_time \
            -show_entries stream=index,codec_name,profile,level,width,height,pix_fmt,r_frame_rate,avg_frame_rate,sample_rate,channels,channel_layout,bit_rate,start_time,duration \
            -of default=nw=1 \
            video.mp4

          echo "===== DECODE CHECK ====="

          ffmpeg -v error \
            -i video.mp4 \
            -f null -

          echo "===== MP4 STRUCTURE CHECK ====="

          ffprobe -v error \
            -show_entries format=format_name \
            -of default=nw=1 \
            video.mp4

          test -s video.mp4

          echo "FINAL VIDEO CHECK PASSED"

      - name: Upload to YouTube
        shell: bash
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          set -e

          TITLE=$(cat title.txt)
          DESCRIPTION=$(cat description.txt)
          TAGS=$(cat tags.txt)

          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "X-Upload-Secret: $UPLOAD_SECRET" \
            -F "video=@video.mp4;type=video/mp4" \
            -F "title=$TITLE" \
            -F "description=$DESCRIPTION" \
            -F "tags=$TAGS" \
            -o upload-response.txt \
            -w "%{http_code}" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/youtube/upload")

          echo "Upload HTTP code: $HTTP_CODE"
          echo "===== YOUTUBE RESPONSE ====="
          cat upload-response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

      - name: Save finished video and assets
        uses: actions/upload-artifact@v4
        with:
          name: ai-tools-daily-v5
          path: |
            video.mp4
            content.json
            script.txt
            voice.mp3
            captions.ass
            presenter.jpg
            visual1.jpg
            visual2.jpg
            visual3.jpg
          retention-days: 7
