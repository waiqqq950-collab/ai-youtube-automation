name: AI Tools Daily - Professional Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ai-tools-daily
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil fonts-dejavu

          ffmpeg -version | head -n 1
          python3 --version

      # =====================================================
      # AI SCRIPT
      # =====================================================

      - name: Get AI script
        run: |
          set -e

          curl -fsSL \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-script" \
            -o script.txt

          test -s script.txt

          echo "===== AI SCRIPT ====="
          cat script.txt

      # =====================================================
      # AI TITLE
      # =====================================================

      - name: Get AI title
        run: |
          set -e

          curl -fsSL \
            -X POST \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data-binary "@script.txt" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-title" \
            -o title.txt

          test -s title.txt

          echo "===== AI TITLE ====="
          cat title.txt

      # =====================================================
      # AI DESCRIPTION
      # =====================================================

      - name: Get AI description
        run: |
          set -e

          curl -fsSL \
            -X POST \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data-binary "@script.txt" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-description" \
            -o description.txt

          test -s description.txt

          echo "===== DESCRIPTION ====="
          cat description.txt

      # =====================================================
      # AI TAGS
      # =====================================================

      - name: Get AI tags
        run: |
          set -e

          curl -fsSL \
            -X POST \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data-binary "@script.txt" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-tags" \
            -o tags.txt

          test -s tags.txt

          echo "===== TAGS ====="
          cat tags.txt

      # =====================================================
      # AI VOICE
      # =====================================================

      - name: Create AI voice
        run: |
          set -e

          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data-binary "@script.txt" \
            -o voice.mp3 \
            -w "%{http_code}" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-audio")

          echo "Audio HTTP code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "===== AUDIO ERROR ====="
            cat voice.mp3 || true
            exit 1
          fi

          test -s voice.mp3

          file voice.mp3

      # =====================================================
      # AUDIO DURATION
      # =====================================================

      - name: Measure voice
        run: |
          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "Audio duration: $DURATION seconds"

          python3 - "$DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          if duration < 5:
              raise SystemExit("ERROR: Audio is too short.")

          if duration > 70:
              raise SystemExit("ERROR: Audio is too long.")
          PY

          printf '%s' "$DURATION" > duration.txt

      # =====================================================
      # CREATE SCENES + CAPTIONS
      # =====================================================

      - name: Build scenes and captions
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math
          import re
          import os

          W = 1080
          H = 1920

          def get_font(size, bold=False):
              if bold:
                  path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              else:
                  path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

              return ImageFont.truetype(path, size)

          big_font = get_font(62, True)
          small_font = get_font(30, False)

          with open("script.txt", encoding="utf-8") as f:
              script = f.read().strip()

          with open("title.txt", encoding="utf-8") as f:
              title = f.read().strip()

          words = re.findall(r"\S+", script)

          labels = [
              "THE HOOK",
              "THE AI TOOL",
              "HOW IT WORKS",
              "TRY THIS",
              "THE BENEFIT",
              "QUICK TAKEAWAY"
          ]

          chunks = []

          for i in range(6):
              start = round(i * len(words) / 6)
              end = round((i + 1) * len(words) / 6)
              chunks.append(" ".join(words[start:end]))

          for i in range(6):

              image = Image.new(
                  "RGB",
                  (W, H),
                  (7, 14, 28)
              )

              draw = ImageDraw.Draw(image)

              draw.rounded_rectangle(
                  (55, 55, W - 55, H - 55),
                  radius=55,
                  fill=(13, 27, 49),
                  outline=(55, 87, 130),
                  width=4
              )

              draw.rounded_rectangle(
                  (85, 110, W - 85, 205),
                  radius=28,
                  fill=(20, 45, 76)
              )

              draw.text(
                  (120, 137),
                  labels[i],
                  font=small_font,
                  fill=(190, 220, 255)
              )

              # Progress dots

              for j in range(6):

                  x = 120 + j * 45

                  radius = 15 if j == i else 10

                  draw.ellipse(
                      (
                          x - radius,
                          260 - radius,
                          x + radius,
                          260 + radius
                      ),
                      fill=(
                          (120, 190, 255)
                          if j == i
                          else (55, 78, 105)
                      )
                  )

              text = chunks[i].strip()

              if not text:
                  text = "One useful AI idea you can use today."

              # Wrap text

              lines = []

              current = ""

              for word in text.split():

                  test = (
                      current + " " + word
                  ).strip()

                  width = draw.textbbox(
                      (0, 0),
                      test,
                      font=big_font
                  )[2]

                  if width > 850:

                      if current:
                          lines.append(current)

                      current = word

                  else:
                      current = test

              if current:
                  lines.append(current)

              y = 470

              for line in lines[:8]:

                  draw.text(
                      (120, y),
                      line,
                      font=big_font,
                      fill=(245, 248, 255)
                  )

                  y += 90

              # Branding

              draw.text(
                  (120, 1700),
                  "AI TOOLS DAILY",
                  font=small_font,
                  fill=(150, 180, 215)
              )

              draw.text(
                  (120, 1760),
                  title[:48],
                  font=small_font,
                  fill=(105, 160, 220)
              )

              image.save(
                  f"scene{i + 1}.png"
              )

          # =================================================
          # CAPTIONS
          # =================================================

          duration = float(
              open("duration.txt").read().strip()
          )

          caption_groups = []

          for i in range(0, len(words), 5):
              caption_groups.append(
                  " ".join(words[i:i + 5])
              )

          def ass_time(seconds):

              hours = int(seconds // 3600)

              seconds -= hours * 3600

              minutes = int(seconds // 60)

              seconds -= minutes * 60

              whole = int(seconds)

              centiseconds = int(
                  round(
                      (seconds - whole) * 100
                  )
              )

              if centiseconds >= 100:
                  whole += 1
                  centiseconds = 0

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{whole:02d}."
                  f"{centiseconds:02d}"
              )

          with open(
              "captions.ass",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "[Script Info]\n"
              )

              f.write(
                  "ScriptType: v4.00+\n"
              )

              f.write(
                  "PlayResX: 1080\n"
              )

              f.write(
                  "PlayResY: 1920\n\n"
              )

              f.write(
                  "[V4+ Styles]\n"
              )

              f.write(
                  "Format: Name, Fontname, Fontsize, "
                  "PrimaryColour, SecondaryColour, "
                  "OutlineColour, BackColour, Bold, "
                  "Italic, Underline, StrikeOut, "
                  "ScaleX, ScaleY, Spacing, Angle, "
                  "BorderStyle, Outline, Shadow, "
                  "Alignment, MarginL, MarginR, "
                  "MarginV, Encoding\n"
              )

              f.write(
                  "Style: Default,DejaVu Sans,54,"
                  "&H00FFFFFF,&H00FFFFFF,"
                  "&H0010182B,&H8010182B,"
                  "-1,0,0,0,100,100,0,0,1,5,2,"
                  "2,80,80,250,1\n\n"
              )

              f.write(
                  "[Events]\n"
              )

              f.write(
                  "Format: Layer, Start, End, Style, "
                  "Name, MarginL, MarginR, MarginV, "
                  "Effect, Text\n"
              )

              step = (
                  duration /
                  max(1, len(caption_groups))
              )

              for i, text in enumerate(
                  caption_groups
              ):

                  start = i * step

                  end = min(
                      duration,
                      (i + 1) * step
                  )

                  text = (
                      text
                      .replace("{", "(")
                      .replace("}", ")")
                  )

                  f.write(
                      "Dialogue: 0,"
                      + ass_time(start)
                      + ","
                      + ass_time(end)
                      + ",Default,,0,0,0,,"
                      + text
                      + "\n"
                  )

          print("Scenes and captions created.")

          PY

          ls -lh scene*.png
          ls -lh captions.ass

      # =====================================================
      # RENDER 1080x1920
      # =====================================================

      - name: Render 1080x1920 video
        run: |
          set -e

          DURATION=$(cat duration.txt)

          SEGMENT=$(python3 -c \
            "print(float('$DURATION') / 6.0)")

          ffmpeg -y \
            -loop 1 \
            -t "$SEGMENT" \
            -i scene1.png \
            -loop 1 \
            -t "$SEGMENT" \
            -i scene2.png \
            -loop 1 \
            -t "$SEGMENT" \
            -i scene3.png \
            -loop 1 \
            -t "$SEGMENT" \
            -i scene4.png \
            -loop 1 \
            -t "$SEGMENT" \
            -i scene5.png \
            -loop 1 \
            -t "$DURATION" \
            -i scene6.png \
            -i voice.mp3 \
            -filter_complex "[0:v]zoompan=z='min(zoom+0.0007,1.08)':d=1:s=1080x1920:fps=30[v0];[1:v]zoompan=z='min(zoom+0.0007,1.08)':d=1:s=1080x1920:fps=30[v1];[2:v]zoompan=z='min(zoom+0.0007,1.08)':d=1:s=1080x1920:fps=30[v2];[3:v]zoompan=z='min(zoom+0.0007,1.08)':d=1:s=1080x1920:fps=30[v3];[4:v]zoompan=z='min(zoom+0.0007,1.08)':d=1:s=1080x1920:fps=30[v4];[5:v]zoompan=z='min(zoom+0.0007,1.08)':d=1:s=1080x1920:fps=30[v5];[v0][v1][v2][v3][v4][v5]concat=n=6:v=1:a=0[vc];[vc]subtitles=captions.ass:fontsdir=/usr/share/fonts/truetype/dejavu[v]" \
            -map "[v]" \
            -map 6:a \
            -t "$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 21 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 160k \
            -movflags +faststart \
            video.mp4

          echo "===== VIDEO INFO ====="

          ffprobe \
            -v error \
            -show_entries \
            stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            video.mp4

          ls -lh video.mp4

      # =====================================================
      # YOUTUBE UPLOAD
      # =====================================================

      - name: Upload to YouTube
        run: |
          set -e

          TITLE=$(cat title.txt | tr '\n' ' ' | sed 's/  */ /g')

          DESCRIPTION=$(cat description.txt | tr '\n' ' ' | sed 's/  */ /g')

          TAGS=$(cat tags.txt | tr '\n' ' ' | sed 's/  */ /g')

          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "X-Upload-Secret: ${{ secrets.UPLOAD_SECRET }}" \
            -H "X-Video-Title: $TITLE" \
            -H "X-Video-Description: $DESCRIPTION" \
            -H "X-Video-Tags: $TAGS" \
            -H "Content-Type: video/mp4" \
            --data-binary "@video.mp4" \
            -o upload-response.txt \
            -w "%{http_code}" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/youtube/upload")

          echo "Upload HTTP code: $HTTP_CODE"

          echo "===== YOUTUBE RESPONSE ====="

          cat upload-response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

      # =====================================================
      # SAVE ARTIFACT
      # =====================================================

      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: ai-tools-daily-short
          path: |
            video.mp4
            script.txt
            title.txt
            description.txt
            tags.txt
            voice.mp3
            captions.ass
            scene1.png
            scene2.png
            scene3.png
            scene4.png
            scene5.png
            scene6.png
