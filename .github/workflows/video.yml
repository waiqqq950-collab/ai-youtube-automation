name: Create YouTube Short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Get AI script
        run: |
          echo "Getting AI script..."

          curl -fL \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-script" \
            -o script.txt

          echo "===== AI SCRIPT ====="
          cat script.txt

          if [ ! -s script.txt ]; then
            echo "ERROR: Script is empty."
            exit 1
          fi

      - name: Create AI voice
        run: |
          echo "Creating AI voice..."

          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "Content-Type: text/plain" \
            --data-binary "@script.txt" \
            -o voice.mp3 \
            -w "%{http_code}" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/daily-audio")

          echo "Audio HTTP code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "===== AUDIO ERROR ====="
            cat voice.mp3
            exit 1
          fi

          if [ ! -s voice.mp3 ]; then
            echo "ERROR: Audio file is empty."
            exit 1
          fi

          ls -lh voice.mp3
          file voice.mp3

      - name: Check audio
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "Audio duration: $DURATION seconds"

          if [ "$(printf "%.0f" "$DURATION")" -lt 3 ]; then
            echo "ERROR: Audio is too short."
            exit 1
          fi

      - name: Create AI presenter
        run: |
          cat > presenter.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="700"
               height="1100"
               viewBox="0 0 700 1100">

            <rect width="700" height="1100" fill="none"/>

            <circle cx="350" cy="330" r="280" fill="#102d49"/>
            <circle cx="350" cy="330" r="220" fill="#173c5c"/>

            <path d="M120 1030 Q150 720 350 690 Q550 720 580 1030 Z"
                  fill="#2563eb"/>

            <rect x="290" y="570"
                  width="120"
                  height="150"
                  rx="35"
                  fill="#d99a72"/>

            <ellipse cx="350"
                     cy="390"
                     rx="170"
                     ry="205"
                     fill="#e5a477"/>

            <path d="M180 370 Q165 160 350 125 Q535 160 520 370
                     L475 300 Q440 210 350 205
                     Q260 210 225 300 Z"
                  fill="#202124"/>

            <circle cx="180" cy="410" r="35" fill="#d99a72"/>
            <circle cx="520" cy="410" r="35" fill="#d99a72"/>

            <circle cx="290" cy="390" r="15" fill="#111827"/>
            <circle cx="410" cy="390" r="15" fill="#111827"/>

            <path d="M350 405 L330 480 L370 480"
                  fill="none"
                  stroke="#a86443"
                  stroke-width="10"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

            <path d="M295 510 Q350 555 405 510"
                  fill="none"
                  stroke="#7c3f2b"
                  stroke-width="12"
                  stroke-linecap="round"/>

            <path d="M170 760 Q350 690 530 760 L590 1030
                     L110 1030 Z"
                  fill="#2563eb"/>

            <rect x="175"
                  y="760"
                  width="350"
                  height="210"
                  rx="18"
                  fill="#111827"/>

            <rect x="195"
                  y="780"
                  width="310"
                  height="170"
                  rx="10"
                  fill="#38bdf8"/>

            <text x="350"
                  y="885"
                  text-anchor="middle"
                  font-family="Arial"
                  font-size="85"
                  font-weight="bold"
                  fill="white">AI</text>

            <path d="M130 980 L570 980 L620 1030 L80 1030 Z"
                  fill="#374151"/>

          </svg>
          SVG

          rsvg-convert presenter.svg -o presenter.png

          echo "Presenter created."
          ls -lh presenter.png

      - name: Create video
        run: |
          echo "Creating 1080x1920 video..."

          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x07111f:s=1080x1920:r=30" \
            -loop 1 \
            -i presenter.png \
            -i voice.mp3 \
            -filter_complex "[0:v]drawbox=x=0:y=0:w=1080:h=1920:color=0x07111f:t=fill,drawbox=x=30:y=30:w=1020:h=1860:color=0x102d49:t=fill,drawbox=x=60:y=60:w=960:h=1800:color=0x07111f:t=fill,drawbox=x=0:y=0:w=1080:h=8:color=0x38bdf8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='AI TOOLS DAILY':fontcolor=white:fontsize=56:x=(w-text_w)/2:y=100,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='WORK SMARTER WITH AI':fontcolor=0x38bdf8:fontsize=34:x=(w-text_w)/2:y=175,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='DAILY AI PRODUCTIVITY TIP':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=250[bg];[1:v]scale=600:943[host];[bg][host]overlay=240:480[v]" \
            -map "[v]" \
            -map 2:a \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            video.mp4

          echo "===== VIDEO CREATED ====="
          ls -lh video.mp4

      - name: Check final video
        run: |
          echo "===== VIDEO INFO ====="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            video.mp4

      - name: Upload to YouTube
        run: |
          echo "Uploading video to YouTube..."

          HTTP_CODE=$(curl -sS \
            -X POST \
            -H "X-Upload-Secret: ${{ secrets.UPLOAD_SECRET }}" \
            -H "Content-Type: video/mp4" \
            --data-binary "@video.mp4" \
            -o upload-response.txt \
            -w "%{http_code}" \
            "https://ai-youtube-automation.waiqqq950.workers.dev/youtube/upload")

          echo "YouTube HTTP code: $HTTP_CODE"

          echo "===== YOUTUBE RESPONSE ====="
          cat upload-response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: YouTube upload failed."
            exit 1
          fi

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: |
            video.mp4
            script.txt
            voice.mp3
            presenter.png
